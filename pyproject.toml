[project]
name = "twinpilot-ai"
version = "0.1.0"
description = "Simulation-based digital twin prototype for excavator operation (Level 1)"
requires-python = ">=3.12"
dependencies = ["twinpilot-sim"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sim"]

[tool.uv.sources]
twinpilot-sim = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
addopts = "-q"
