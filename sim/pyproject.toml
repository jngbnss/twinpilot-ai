[project]
name = "twinpilot-sim"
version = "0.1.0"
description = "Deterministic excavator simulator, telemetry schema, safety layer and fault injection"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6",
    "pyarrow>=16",
]

[project.scripts]
twinpilot-sim = "twinpilot_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpilot_sim"]
