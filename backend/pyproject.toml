[project]
name = "twinpilot-backend"
version = "0.1.0"
description = "TwinPilot backend: telemetry collection, twin state store, safety, replay, API"
requires-python = ">=3.12"
dependencies = [
    "twinpilot-sim",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
twinpilot-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
