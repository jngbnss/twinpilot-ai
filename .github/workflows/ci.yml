name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-extras  # includes scikit-learn reference for IF equivalence test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
