[project]
name = "twinpilot-ai"
version = "0.1.0"
description = "Feature extraction, anomaly detection and evaluation for TwinPilot telemetry"
requires-python = ">=3.12"
dependencies = [
    "twinpilot-sim",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "joblib>=1.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
# reference implementation used only for an equivalence test on CI (Linux)
sklearn = ["scikit-learn>=1.5"]

[tool.uv.sources]
twinpilot-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpilot_ai"]
